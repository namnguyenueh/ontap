<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5ca8">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ôn tập QH">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Ôn tập Quy hoạch</title>
<script src="config.js"></script>
<script>var NAM=(window.NAM_ON_TAP||2026),TEN=(window.TEN_APP||"Ôn tập Quy hoạch");document.title=TEN+" "+NAM;</script>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dde3ea;
  --pri:#0b5ca8;--pri2:#e7f0fa;--ok:#16834a;--okbg:#e5f5ec;--bad:#c62f2f;--badbg:#fdeaea;--warn:#b26a00;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151b;--card:#1a212a;--ink:#e8edf2;--mute:#9aa7b4;--line:#2c3540;
  --pri:#5aa6f0;--pri2:#1b2c40;--ok:#4cc584;--okbg:#14301f;--bad:#f07272;--badbg:#3a1b1b;--warn:#f0b04a;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header.top h1{font-size:19px;margin:0;flex:1;line-height:1.25}
header.top small{display:block;color:var(--mute);font-weight:400;font-size:13px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;
  border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.icon{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;background:var(--card);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.mode{text-align:left;padding:12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line)}
.mode b{display:block;font-size:15px}
.mode span{font-size:12.5px;color:var(--mute)}
.mode.on{border-color:var(--pri);background:var(--pri2)}
.lbl{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px}
input[type=search],input[type=number],input[type=password],input[type=text],select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.topics{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:left;width:100%}
.topic.on{border-color:var(--pri);background:var(--pri2)}
.topic .nm{flex:1;font-weight:600;font-size:15px}
.topic .ct{font-size:12.5px;color:var(--mute);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok)}
.topic .tx{flex:1;min-width:0}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.topic.on .chk{background:var(--pri);border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sticky .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.sticky .btn{flex:1}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* quiz */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qhead .t{flex:1;min-width:0}
.qhead .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead .t span{font-size:13px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}
.qtext{font-size:17px;font-weight:600;margin:0 0 4px;white-space:pre-line}
.res-item .q{white-space:pre-line}
.stats{margin-top:12px}
.qmeta{font-size:12.5px;color:var(--mute);margin-bottom:12px}
.multi{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);margin-left:4px}
.ans{display:flex;flex-direction:column;gap:8px}
.a{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);font-size:16px}
.a .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.a.sel{border-color:var(--pri);background:var(--pri2)}
.a.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.a.right{border-color:var(--ok);background:var(--okbg)}
.a.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.a.wrong{border-color:var(--bad);background:var(--badbg)}
.a.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.a:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.g{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.g.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.g.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.g.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.g.done{background:var(--pri2);border-color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{background:var(--bg);width:100%;max-width:720px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.score{text-align:center;padding:24px 14px}
.score .big{font-size:52px;font-weight:800;line-height:1}
.score .sub{color:var(--mute);margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:.92}
.res-item{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.res-item .q{font-weight:600;font-size:15px}
.res-item .l{font-size:14px;margin-top:4px}
.res-item .l.ok{color:var(--ok)}
.res-item .l.no{color:var(--bad)}
.lvcard{background:linear-gradient(135deg,#0b5ca8,#1d86d6);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.lvtop{display:flex;align-items:center;gap:12px}
.lvbadge{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
.lvcard b{font-size:16px}
.lvcard span{font-size:12.5px;opacity:.9}
.xpbar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:#ffd34d;border-radius:4px}
.streak{text-align:center;font-size:22px;line-height:1;flex:none}
.streak b{display:block;font-size:17px;margin-top:2px}
.games{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.game{border-radius:14px;padding:12px 8px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;justify-content:center}
.game .ge{font-size:30px}
.game b{font-size:15px}
.game span{font-size:11.5px;opacity:.92;line-height:1.3}
.g1{background:linear-gradient(160deg,#16a34a,#0e7a37)}
.g2{background:linear-gradient(160deg,#e5484d,#b4232a)}
.g3{background:linear-gradient(160deg,#f59e0b,#c2410c)}
.game:active,.node:active{transform:scale(.97)}
.path{display:flex;flex-direction:column;gap:10px;padding:6px 0 30px}
.node{display:flex;align-items:center;gap:10px;width:62%;min-width:230px;padding:10px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);text-align:left}
.node .nn{width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.node .nt{min-width:0}
.node .nt b{display:block;font-size:14px;line-height:1.25}
.node .nt span{font-size:13px;color:#f5b301;letter-spacing:1px}
.node .nt em{color:var(--line);font-style:normal}
.node.part{border-color:#f5b301}.node.part .nn{background:#f5b301;color:#fff}
.node.full{border-color:var(--ok)}.node.full .nn{background:var(--ok);color:#fff}
.node.rec{box-shadow:0 0 0 4px var(--pri2);border-color:var(--pri);animation:pulse 1.6s infinite}
.node.rec .nn{background:var(--pri);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--pri2)}}
.gscore{text-align:right}.gscore b{display:block;font-size:22px;line-height:1;color:var(--pri)}.gscore span{font-size:12px;color:var(--mute)}
.hearts{font-size:15px;letter-spacing:2px}
.gtime{font-weight:800;color:var(--warn);font-size:15px}.gtime.hurry{color:var(--bad)}
.combo{text-align:center;font-weight:800;color:var(--warn);height:0;opacity:0;transition:.2s;overflow:hidden}
.combo.on{height:26px;opacity:1}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);font-size:34px;font-weight:900;opacity:0;pointer-events:none;z-index:15}
.pop.show{animation:pop .7s ease-out}
.pop.ok{color:var(--ok)}.pop.no{color:var(--bad);font-size:26px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.over .ttl{font-size:22px;font-weight:800;margin-top:6px}
.bigstars{font-size:58px;letter-spacing:6px;line-height:1}
.bigstars span{color:var(--line);display:inline-block}
.bigstars span.on{color:#f5b301;animation:starin .5s both}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.newrec{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;background:#fff4cc;color:#8a5a00;font-weight:800}
.xpgain{margin-top:10px;font-weight:800;color:var(--pri)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf span{position:absolute;top:-40px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.sndbtn{font-size:18px}
.expl{margin-top:10px;padding:12px;border-radius:12px;background:var(--pri2);font-size:15px}
.res-item .l.ex{color:var(--mute);font-size:13.5px}
.wm{position:fixed;inset:0;pointer-events:none;z-index:35;background-repeat:repeat}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>
<script>
function runApp(RAW,USER){
"use strict";
var hid={};(RAW.hidden||[]).forEach(function(n){hid[n]=1;});
var ALLT=RAW.t,TOPICS=[],tmap={};
ALLT.forEach(function(n,i){if(!hid[n]){tmap[i]=TOPICS.length;TOPICS.push(n);}});
var Q=[];RAW.q.forEach(function(q){if(q[0] in tmap)Q.push([tmap[q[0]],q[1],q[2],q[3],q[4]||'']);});
function hsh(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function qkey(q){return hsh(q[1]+'|'+q[2].join('|'));}
var HK=Q.map(qkey);
var L='ABCDEFG';
var KEY='ontap-qh2025-v1';
var store={sth:{},starsN:{},selN:[],mode:'seq',n:30,min:30};
try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);for(var k in o)store[k]=o[k];}}catch(e){}
if(!store.v2){ // chuyển kết quả cũ (theo số thứ tự) sang dạng mới (theo nội dung câu)
  var FH=RAW.q.map(qkey),k2;
  if(store.st)for(k2 in store.st){if(FH[k2])store.sth[FH[k2]]=store.st[k2];}
  if(store.stars)for(k2 in store.stars){if(ALLT[k2])store.starsN[ALLT[k2]]=store.stars[k2];}
  if(store.sel)store.selN=store.sel.map(function(i){return ALLT[i];}).filter(Boolean);
  store.v2=1;
}
store.st={};HK.forEach(function(h,i){if(store.sth[h])store.st[i]=store.sth[h];});
store.stars={};TOPICS.forEach(function(n,i){if(store.starsN[n])store.stars[i]=store.starsN[n];});
store.sel=[];(store.selN||[]).forEach(function(n){var i=TOPICS.indexOf(n);if(i>=0)store.sel.push(i);});
function save(){
  HK.forEach(function(h,i){if(store.st[i])store.sth[h]=store.st[i];else delete store.sth[h];});
  TOPICS.forEach(function(n,i){if(store.stars[i])store.starsN[n]=store.stars[i];});
  store.selN=store.sel.map(function(i){return TOPICS[i];});
  var o={};for(var k in store){if(k!=='st'&&k!=='stars'&&k!=='sel')o[k]=store[k];}
  try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
}
// st[id] = 1 đúng, 2 sai (lần trả lời gần nhất)
var app=document.getElementById('app'), sheet=document.getElementById('sheet'), sheetBox=document.getElementById('sheetBox');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._);toast._=setTimeout(function(){t.classList.remove('show');},1600);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
var byTopic=TOPICS.map(function(){return [];});
Q.forEach(function(q,i){byTopic[q[0]].push(i);});
var order=TOPICS.map(function(_,i){return i;});

/* ---------- HOME ---------- */
var filter='';
function topicStat(ti){var ids=byTopic[ti],ok=0,no=0;ids.forEach(function(i){var v=store.st[i];if(v===1)ok++;else if(v===2)no++;});return {n:ids.length,ok:ok,no:no};}
function home(){
  stopTimer();if(typeof stopG==='function')stopG();
  var ok=0,no=0;for(var k in store.st){if(store.st[k]===1)ok++;else if(store.st[k]===2)no++;}
  var selSet={};store.sel.forEach(function(i){selSet[i]=1;});
  var poolN=pool().length;
  var h='<header class="top"><h1>'+esc(TEN+' '+NAM)+'<small>'+fmt(Q.length)+' câu hỏi · '+TOPICS.length+' chủ đề'+(USER&&USER.code?'<br>👤 '+esc(USER.name?USER.name+' ('+USER.code+')':USER.code):'')+'</small></h1><button class="icon sndbtn" id="snd" aria-label="Âm thanh">'+(store.snd?'🔊':'🔇')+'</button></header>';
  h+=gameHome();
  h+='<div class="stats"><div class="stat"><b>'+fmt(ok+no)+'</b><span>Đã làm</span></div><div class="stat"><b style="color:var(--ok)">'+fmt(ok)+'</b><span>Đúng</span></div><div class="stat"><b style="color:var(--bad)">'+fmt(no)+'</b><span>Đang sai</span></div></div>';
  h+='<div class="lbl">Cách ôn</div><div class="modes">';
  [['seq','Ôn lần lượt','Theo thứ tự, chấm ngay'],['rnd','Ôn ngẫu nhiên','Xáo trộn câu, chấm ngay'],['exam','Thi thử','Chấm khi nộp bài, có giờ'],['wrong','Làm lại câu sai','Chỉ những câu đang sai']].forEach(function(m){
    h+='<button class="mode'+(store.mode===m[0]?' on':'')+'" data-mode="'+m[0]+'"><b>'+m[1]+'</b><span>'+m[2]+'</span></button>';
  });
  h+='</div>';
  if(store.mode==='exam'){
    h+='<div class="card"><div style="font-weight:600">Số câu</div><div class="opt-row" id="nOpts">';
    [20,30,50,100].forEach(function(n){h+='<button class="pill'+(store.n===n?' on':'')+'" data-n="'+n+'">'+n+'</button>';});
    h+='</div><div style="font-weight:600;margin-top:12px">Thời gian</div><div class="opt-row" id="mOpts">';
    [[0,'Không giới hạn'],[15,'15 phút'],[30,'30 phút'],[45,'45 phút'],[60,'60 phút']].forEach(function(m){h+='<button class="pill'+(store.min===m[0]?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>';});
    h+='</div></div>';
  }
  h+='<div class="lbl">Chủ đề <span style="text-transform:none;font-weight:600">· '+(store.sel.length?('đã chọn '+store.sel.length):'chưa chọn = tất cả')+'</span></div>';
  h+='<div class="row"><input type="search" id="tf" placeholder="Tìm chủ đề…" value="'+esc(filter)+'"><button class="btn" id="clr" style="flex:none">Bỏ chọn</button></div>';
  h+='<div class="topics" id="tl">'+topicList(selSet)+'</div>';
  h+='<div class="lbl">Tìm câu hỏi</div><div class="row"><input type="search" id="qs" placeholder="Gõ từ khóa trong câu hỏi…"><button class="btn" id="qsb" style="flex:none">Tìm</button></div>';
  h+='<div style="margin-top:18px;text-align:center"><button class="btn ghost" id="reset" style="color:var(--bad)">Xóa toàn bộ kết quả đã làm</button>'+(RAW.meta&&RAW.meta.updated?'<div style="font-size:12.5px;color:var(--mute);margin-top:6px">Bộ câu hỏi cập nhật ngày '+esc(RAW.meta.updated)+'</div>':'')+'</div>';
  app.innerHTML=h;
  var st=document.createElement('div');st.className='sticky';st.id='homeBar';
  st.innerHTML='<div class="in"><button class="btn pri" id="go"'+(poolN?'':' disabled')+'>'+startLabel(poolN)+'</button></div>';
  app.appendChild(st);
  app.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){store.mode=b.dataset.mode;save();home();};});
  app.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){store.n=+b.dataset.n;save();home();};});
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){store.min=+b.dataset.m;save();home();};});
  var tf=document.getElementById('tf');
  tf.oninput=function(){filter=tf.value;document.getElementById('tl').innerHTML=topicList(selSet);bindTopics();};
  document.getElementById('clr').onclick=function(){store.sel=[];save();home();};
  bindTopics();
  document.getElementById('go').onclick=start;

function gAnswer(id,q){
  G.lock=true;var ok=same(G.pick,q[3]);
  app.querySelectorAll('.a').forEach(function(b){var j=+b.dataset.j;b.disabled=true;b.classList.remove('sel');if(q[3].indexOf(j)>=0)b.classList.add('right');else if(G.pick.indexOf(j)>=0)b.classList.add('wrong');});
  store.st[id]=ok?1:2;
  var pop=document.getElementById('pop');
  if(ok){G.combo++;G.maxc=Math.max(G.maxc,G.combo);G.ok++;var pts=10+Math.min(G.combo-1,10)*2;G.score+=pts;pop.textContent='+'+pts;pop.className='pop show ok';}
  else{G.combo=0;G.bad++;G.wrong.push([id,G.pick.slice()]);pop.textContent=G.type==='surv'?'-1 ❤️':'Sai rồi';pop.className='pop show no';if(G.type==='surv'){G.lives--;var hh=document.getElementById('hearts');if(hh)hh.innerHTML='❤️'.repeat(G.lives)+'<span style="opacity:.25">'+'❤️'.repeat(3-G.lives)+'</span>';}
    var c=app.querySelector('.gcard');c.classList.add('shake');}
  beep(ok);
  document.getElementById('gs').textContent=fmt(G.score);
  var cb=app.querySelector('.combo');cb.textContent='🔥 Chuỗi đúng x'+G.combo;cb.classList.toggle('on',G.combo>=2);
  save();
  gWait=setTimeout(function(){
    if(G.type==='surv'&&G.lives<=0)return gOver();
    if(G.type==='race'&&Date.now()>=G.end)return gOver();
    G.i++;gQ();
  },ok?700:(G.type==='race'?1300:1900));
}
function gOver(){
  if(!G||G.done)return;G.done=true;stopG();
  touchDay();store.xp+=G.score;
  var rec=false,stars=0,h='';
  if(G.type==='journey'){stars=G.ok>=10?3:G.ok>=8?2:G.ok>=6?1:0;if(stars>(store.stars[G.ti]||0)){store.stars[G.ti]=stars;rec=stars>0;}}
  else{if(G.score>(store.best[G.type]||0)){store.best[G.type]=G.score;rec=G.score>0;}}
  save();
  h+='<div class="card score over">';
  if(G.type==='journey'){h+='<div class="bigstars">'+[1,2,3].map(function(n){return '<span class="'+(n<=stars?'on':'')+'" style="animation-delay:'+(n*.25)+'s">★</span>';}).join('')+'</div><div class="ttl">'+(stars===3?'Hoàn hảo!':stars===2?'Rất tốt!':stars===1?'Qua màn!':'Chưa qua màn')+'</div><div class="sub">Đúng '+G.ok+'/10 câu'+(stars<1?' · cần đúng ít nhất 6 câu':'')+'</div>';}
  else{h+='<div class="ge" style="font-size:46px">'+(G.type==='surv'?'💔':'⏱️')+'</div><div class="ttl">'+(G.type==='surv'?'Hết mạng!':'Hết giờ!')+'</div><div class="big" style="color:var(--pri)">'+fmt(G.score)+'</div><div class="sub">điểm · đúng '+G.ok+' câu · chuỗi dài nhất x'+G.maxc+'</div>';}
  if(rec)h+='<div class="newrec">🏆 '+(G.type==='journey'?'Thành tích mới!':'Kỷ lục mới!')+'</div>';
  h+='<div class="xpgain">+'+fmt(G.score)+' XP</div></div>';
  if(G.wrong.length){h+='<div class="lbl">Câu trả lời sai</div>';G.wrong.forEach(function(w){var q=Q[w[0]];
    h+='<div class="res-item"><div class="q">'+esc(q[1])+'</div><div class="l no">Bạn chọn: '+w[1].map(function(a){return L[a]+'. '+esc(q[2][a]);}).join('; ')+'</div><div class="l ok">Đáp án: '+q[3].map(function(a){return L[a]+'. '+esc(q[2][a]);}).join('; ')+'</div>'+(q[4]?'<div class="l ex">💡 '+esc(q[4])+'</div>':'')+'</div>';});}
  app.innerHTML='<div class="qhead"><button class="icon" id="back">‹</button><div class="t"><b>Kết quả</b><span>'+(G.type==='journey'?esc(TOPICS[G.ti]):G.type==='surv'?'Sinh tồn':'Đua 60 giây')+'</span></div></div>'+h;
  var bar=document.createElement('div');bar.className='sticky';
  var nextT=null;if(G.type==='journey'&&stars>0){var k=order.indexOf(G.ti);if(k<order.length-1)nextT=order[k+1];}
  bar.innerHTML='<div class="in"><button class="btn" id="gb">'+(G.type==='journey'?'Bản đồ':'Về trang chính')+'</button><button class="btn" id="ga">Chơi lại</button>'+(nextT!==null?'<button class="btn pri" id="gn">Màn tiếp ›</button>':'')+'</div>';
  app.appendChild(bar);
  var t=G.type,ti=G.ti;
  document.getElementById('back').onclick=document.getElementById('gb').onclick=function(){t==='journey'?journey():home();};
  document.getElementById('ga').onclick=function(){startGame(t,ti);};
  var gn=document.getElementById('gn');if(gn)gn.onclick=function(){startGame('journey',nextT);};
  if(rec||stars===3)confetti();
  window.scrollTo(0,0);
}

home();
}
/* ---------- ĐĂNG NHẬP: MÃ CÁN BỘ + MẬT KHẨU ---------- */
(function(){
var PK='ontap-qh2025-pw',CK='ontap-qh2025-ma',NEED=!!window.YEU_CAU_MA_CB,ENC=null;
var app=document.getElementById('app');
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function normCode(s){return String(s||'').replace(/\s+/g,'').toUpperCase();}
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function unlock(pw){
  var c=window.crypto&&window.crypto.subtle;if(!c)return Promise.reject('nocrypto');
  return c.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return c.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return c.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));},function(){throw 'pw';})
  .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));},function(e){throw e==='pw'?'pw':'pw';});
}
function check(raw,code){
  var codes=raw.codes||{},user={code:'',name:''};
  if(NEED){
    if(!code)throw 'nocode';
    if(Object.keys(codes).length&&!Object.prototype.hasOwnProperty.call(codes,code))throw 'badcode'; // danh sách trống = mã nào cũng vào được
    user.code=code;user.name=codes[code]||'';
  }
  return user;
}
function watermark(text){
  var w=Math.max(230,text.length*13+90),h=Math.round(w*0.62);
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'><text x='"+(w/2)+"' y='"+(h/2+6)+"' text-anchor='middle' transform='rotate(-28 "+(w/2)+" "+(h/2)+")' font-family='Arial,Helvetica,sans-serif' font-size='19' font-weight='700' fill='rgba(120,120,120,0.17)'>"+esc(text)+"</text></svg>";
  var d=document.createElement('div');d.className='wm';
  d.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  document.body.appendChild(d);
}
function start(raw,user){
  runApp(raw,user);
  watermark(user.code||'TÀI LIỆU NỘI BỘ');
}
var MSG={pw:'Sai mật khẩu, vui lòng thử lại.',nocode:'Vui lòng nhập mã cán bộ.',badcode:'Mã cán bộ không có trong danh sách được phép sử dụng.',nocrypto:'Trình duyệt này không hỗ trợ. Hãy mở bằng Safari hoặc Chrome qua đường link https.'};
function form(msg){
  var sc=get(CK)||'';
  app.innerHTML='<div style="max-width:420px;margin:10vh auto 0;text-align:center"><div style="font-size:44px">🔒</div><h1 style="font-size:21px;margin:8px 0 4px">'+esc(TEN+' '+NAM)+'</h1><p style="color:var(--mute);margin:0 0 18px">'+(NEED?'Nhập mã cán bộ và mật khẩu để sử dụng':'Nhập mật khẩu để mở bộ câu hỏi')+'</p>'+
  '<form id="pf">'+(NEED?'<input type="text" id="ma" placeholder="Mã cán bộ" autocapitalize="characters" autocomplete="username" value="'+esc(sc)+'" style="text-align:center;margin-bottom:10px">':'')+
  '<input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" style="text-align:center;margin-bottom:10px">'+
  '<label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mute);margin-bottom:14px"><input type="checkbox" id="rm" checked> Ghi nhớ trên máy này</label>'+
  '<button class="btn pri" style="width:100%" id="pb">Mở</button></form><p id="pm" style="color:var(--bad);min-height:24px;margin-top:12px">'+(msg||'')+'</p>'+
  '<p style="font-size:12.5px;color:var(--mute);margin-top:18px">Tài liệu nội bộ – không chia sẻ ra ngoài.</p></div>';
  document.getElementById('pf').onsubmit=function(e){e.preventDefault();
    var pw=document.getElementById('pw').value.trim(),ma=NEED?normCode(document.getElementById('ma').value):'';
    if(NEED&&!ma){document.getElementById('pm').textContent=MSG.nocode;return;}
    if(!pw)return;
    var bt=document.getElementById('pb');bt.disabled=true;bt.textContent='Đang mở…';
    unlock(pw).then(function(raw){
      var user=check(raw,ma);
      if(document.getElementById('rm').checked){set(PK,pw);set(CK,ma||null);}else{set(PK,null);set(CK,null);}
      start(raw,user);
    }).catch(function(err){form(MSG[err]||MSG.pw);});
  };
  setTimeout(function(){var p=document.getElementById(NEED&&!sc?'ma':'pw');if(p)p.focus();},50);
}
function boot(){
  var pw=get(PK),ma=get(CK)||'';
  if(pw){
    app.innerHTML='<div class="empty" style="margin-top:30vh">Đang mở…</div>';
    unlock(pw).then(function(raw){start(raw,check(raw,ma));}).catch(function(err){
      if(err==='pw')set(PK,null);
      form(err==='badcode'?MSG.badcode:(err==='nocode'?'':MSG.pw.replace('Sai mật khẩu','Mật khẩu đã được thay đổi')));
    });
  } else form();
}
app.innerHTML='<div class="empty" style="margin-top:30vh">Đang tải…</div>';
fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){ENC=j;boot();})
.catch(function(){app.innerHTML='<div class="empty" style="margin-top:25vh">Không tải được dữ liệu.<br>Kiểm tra kết nối mạng rồi mở lại.<br><br><button class="btn pri" onclick="location.reload()">Thử lại</button></div>';});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();

</script>
