<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#17212b;--mute:#5f6b78;--soft:#97a2ae;--line:#e3e8ee;--line2:#eef1f5;
  --pri:#0b5ca8;--pri2:#e9f1fb;--ok:#15803d;--okbg:#e8f6ed;--ok2:#7fc49a;--bad:#c53030;--badbg:#fdeeee;
  --warn:#b7791f;--warnbg:#fdf4e1;--grey:#c3cbd4;--r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141a;--card:#182029;--ink:#e7edf3;--mute:#9daab7;--soft:#6f7c89;--line:#2a333e;--line2:#212a34;
  --pri:#5ea8f2;--pri2:#16283b;--ok:#4cc584;--okbg:#122b1c;--ok2:#3e8a5f;--bad:#f07878;--badbg:#36191a;
  --warn:#eab04f;--warnbg:#33280f;--grey:#46515d}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding:10px 16px 110px}
.hide{display:none!important}
.mute{color:var(--mute)}.small{font-size:13px}
/* đầu trang */
.hd{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
.hd .ht{flex:1;min-width:0}
.hd .ht b{display:block;font-size:19px;line-height:1.25}
.hd .ht span{display:block;font-size:13px;color:var(--mute)}
.ib{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mute)}
.ib:active{background:var(--line2)}
.ib svg{width:22px;height:22px}
.online{color:var(--ok);font-weight:600;font-size:12.5px}.online:empty{display:none}
/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15.5px;text-align:center;line-height:1.25}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{width:100%;min-height:54px;font-size:17px;letter-spacing:.02em}
.btn.w{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.985)}
.lnk{color:var(--pri);font-weight:600;font-size:14.5px;padding:6px 2px}
/* khối */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{margin-top:26px}
.sec>h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec>h2 .lnk{margin-left:auto;font-size:13.5px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.hero h1{font-size:20px;margin:0 0 4px;line-height:1.3}
.hero .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.why-list{list-style:none;margin:0 0 16px;padding:0}
.why-list li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:15px}
.why-list li:last-child{border-bottom:0}
.why-list li b{margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--grey)}
.steps{display:flex;gap:8px;margin:0 0 16px;font-size:13px;color:var(--mute)}
.steps div{flex:1;background:var(--line2);border-radius:10px;padding:8px;text-align:center;line-height:1.35}
.steps b{display:block;color:var(--ink);font-size:15px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--warnbg);margin-bottom:12px}
.banner div{flex:1;font-size:14px}
.banner .btn{min-height:40px;padding:0 14px;font-size:14px}
/* số liệu */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi div{padding:12px 8px;text-align:center;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi div:nth-child(3n){border-right:0}
.kpi div:nth-last-child(-n+3){border-bottom:0}
.kpi b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mute)}
/* danh sách chủ đề */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row:active{background:var(--line2)}
.row .tx{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px;line-height:1.35}
.row .mt{font-size:12.5px;color:var(--mute);margin-top:2px}
.row .chev{color:var(--soft);font-size:20px;flex:none}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);margin-top:7px}
.seg i{display:block;height:100%}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--line2);color:var(--mute)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.pri{background:var(--pri2);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
input[type=search],input[type=text],input[type=password],input[type=number]{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.srch{display:flex;gap:8px;margin-bottom:12px}
.srch .btn{flex:none;min-height:46px}
/* thanh điều hướng */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:680px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:var(--soft);font-weight:600}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--pri)}
.act{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.act .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.act .btn{flex:1}
/* màn hình câu hỏi */
.qtop{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.qtop .pg{flex:1;min-width:0}
.qtop .pg span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .25s}
.flag.on{color:var(--warn)}
.flag.on svg{fill:currentColor}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--mute);padding:0 4px}
.timer.hurry{color:var(--bad)}
.why{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mute);background:var(--line2);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.qtopic{font-size:12.5px;color:var(--soft);margin-bottom:6px}
.qtext{font-size:17.5px;font-weight:600;line-height:1.5;margin:0 0 16px;white-space:pre-line;overflow-wrap:anywhere}
.multi{display:block;font-size:13px;font-weight:700;color:var(--warn);margin:-8px 0 12px}
.opts{display:flex;flex-direction:column;gap:9px}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.o .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--grey);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;margin-top:-1px}
.o .ot{flex:1;min-width:0;white-space:pre-line}
.o .mk{flex:none;font-weight:800;font-size:17px;line-height:1.3}
.o.sel{border-color:var(--pri);background:var(--pri2)}.o.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.o.right{border-color:var(--ok);background:var(--okbg)}.o.right .k{background:var(--ok);border-color:var(--ok);color:#fff}.o.right .mk{color:var(--ok)}
.o.wrong{border-color:var(--bad);background:var(--badbg)}.o.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}.o.wrong .mk{color:var(--bad)}
.o.dim{opacity:.6}
.o:disabled{cursor:default}
.idk{display:block;margin:14px auto 0;color:var(--mute);font-size:14px;text-decoration:underline;padding:6px}
.fb{margin-top:16px;border-radius:14px;padding:14px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb .h{font-weight:700;font-size:16px}
.fb.ok .h{color:var(--ok)}.fb.no .h{color:var(--bad)}
.fb .s{color:var(--mute);font-size:14px;margin-top:2px}
.ex{margin-top:12px;border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.ex b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.ex.key{border-color:var(--ok)}.ex.trap{border-color:var(--bad)}.ex.tip{border-color:var(--warn)}.ex.exp{border-color:var(--pri)}
.noex{margin-top:12px;font-size:13.5px;color:var(--soft)}
.rate{margin-top:18px}
.rate p{margin:0 0 8px;font-weight:600;font-size:14.5px}
.rate .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate .g.three button:last-child{grid-column:1 / -1}
.rate button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;padding:4px 6px;line-height:1.25}
.rate button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rate button.on{border-color:var(--pri);background:var(--pri2)}
.rate .nt{font-size:12.5px;color:var(--soft);margin-top:8px}
/* lưới câu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.gc{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;position:relative}
.gc.done{background:var(--pri2);border-color:var(--pri)}
.gc.cur{box-shadow:0 0 0 2px var(--pri) inset}
.gc.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.gc.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.gc.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
/* lựa chọn */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:600}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.field{margin-bottom:18px}
.field>label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line2);width:100%;text-align:left;font-size:15px}
.chk i{width:22px;height:22px;border-radius:6px;border:2px solid var(--grey);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:13px}
.chk.on i{background:var(--pri);border-color:var(--pri)}
/* kết quả */
.score{text-align:center;padding:22px 14px}
.score .big{font-size:50px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;font-weight:700;color:var(--mute)}
.score .sub{color:var(--mute);margin-top:6px;font-size:14.5px}
.trio{display:flex;margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.trio div{flex:1;text-align:center}.trio b{display:block;font-size:19px}.trio span{font-size:12.5px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);background:var(--line2);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5}
.ri{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:14.5px}
.ri:last-child{border-bottom:0}
.ri .ic{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.ri .tx{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:14.5px}
.tb:last-child{border-bottom:0}
.tb .nm{flex:1;min-width:0}
.tb .bw{width:34%;flex:none}
.tb .v{width:54px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.hb{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.hb i{display:block;height:100%;border-radius:4px}
.days{display:flex;align-items:flex-end;gap:4px;height:96px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
.days i{display:block;border-radius:3px 3px 0 0;background:var(--ok2)}
.days i.w{background:var(--badbg);border-radius:0}
.dlab{display:flex;gap:4px;font-size:10.5px;color:var(--soft);margin-top:4px}.dlab span{flex:1;text-align:center;min-width:0}
.todo{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .tx{flex:1;min-width:0;font-size:14.5px}
.todo .tx b{display:block;font-size:15px}
.todo .btn{min-height:40px;padding:0 14px;font-size:14px;flex:none}
.empty{color:var(--mute);text-align:center;padding:28px 12px;font-size:14.5px}
.foot{text-align:center;font-size:12.5px;color:var(--soft);margin-top:30px;line-height:1.7}
/* bảng trượt */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.show{display:flex}
.sheet .sb{background:var(--bg);width:100%;max-width:680px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .row2{display:flex;gap:8px;margin-top:14px}.sheet .row2 .btn{flex:1}
@media (min-width:700px){.sheet{align-items:center}.sheet .sb{border-radius:20px;max-height:80vh}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:.94}
.wm{position:fixed;inset:0;pointer-events:none;z-index:35;background-repeat:repeat}
.cl{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.cl span{color:var(--mute);font-size:12.5px}.cl div{margin-top:2px}
.help p{margin:0 0 10px;font-size:14.5px}
@media (min-width:700px){.wrap{padding-top:18px}.qtext{font-size:18.5px}}
</style>

<style id="vtb-theme">

:root{--bg:#eef3f9;--pri:#005b9a;--pri-d:#003a70;--pri2:#e4effa;--red:#e2231a;--line:#dde5ee;--line2:#edf2f7;--r:16px;

/* đầu trang dạng dải xanh */

.btn{border-radius:14px}
.btn.pri{background:var(--grad);border:0;box-shadow:0 6px 16px rgba(0,91,154,.28)}
.btn.big{min-height:56px;font-size:17px;letter-spacing:.04em}
.box,.list,.kpi{border:0;box-shadow:var(--sh)}
.sec>h2{font-size:16px;color:var(--pri-d);padding-left:10px;border-left:4px solid var(--red);line-height:1.2}
@media (prefers-color-scheme:dark){.sec>h2{color:var(--ink)}}
/* số liệu */
.kpi{gap:10px;background:none;box-shadow:none;overflow:visible}
.kpi div{background:var(--card);border:0!important;border-radius:16px;box-shadow:var(--sh);padding:14px 6px 12px;position:relative}
.kpi div::before{content:"";display:block;width:26px;height:4px;border-radius:2px;margin:0 auto 8px;background:var(--pri)}
.kpi div:nth-child(2)::before{background:#0a9ad6}.kpi div:nth-child(3)::before{background:var(--ok)}

.kpi b{font-size:22px;color:var(--pri-d)}
@media (prefers-color-scheme:dark){.kpi b{color:var(--ink)}}
/* danh sách chủ đề */
.list{border-radius:18px}
.row{padding:14px 14px}

.row .chev{display:none}

.qtopic{color:var(--pri);font-weight:600}
.qtext{font-size:18.5px;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);border-top:4px solid var(--pri)}
.o{border-radius:16px;border:1.5px solid transparent;box-shadow:var(--sh);padding:14px}
.o .k{border-color:var(--pri);color:var(--pri);background:var(--pri2)}
.o.sel{border-color:var(--pri)}
.fb{border-radius:18px;box-shadow:var(--sh)}
.ex{background:var(--card);border-radius:0 12px 12px 0;padding:10px 12px;border-left-width:4px}

.rate button.on{border-color:var(--pri)}

.score .big small,.score .sub,.trio span{color:rgba(255,255,255,.8)!important}

.act{background:var(--card);border-top:0;box-shadow:0 -4px 18px rgba(10,40,80,.08)}

<body>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<div class="sheet" id="sheet"><div class="sb" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">
<script>
function runApp(RAW,USER){
"use strict";
/* ================= DỮ LIỆU CÂU HỎI (chỉ đọc, không sửa nội dung) ================= */
var hid={};(RAW.hidden||[]).forEach(function(n){hid[n]=1;});
var TOPICS=[],tmap={};
(RAW.t||[]).forEach(function(n,i){if(!hid[n]){tmap[i]=TOPICS.length;TOPICS.push(n);}});
var Q=[];
(RAW.q||[]).forEach(function(q){
  if(!q||!(q[0] in tmap)||!q[1]||!q[2]||q[2].length<2||!q[3]||!q[3].length)return;
  Q.push([tmap[q[0]],String(q[1]),q[2].map(String),q[3],q[4]||'',q[5]||'',q[6]||'']);
});
// Q[i] = [chủ đề, câu hỏi, phương án[], đáp án đúng[], giải thích, điểm dễ nhầm, mẹo nhớ]
function hsh(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
var H=Q.map(function(q){return hsh(q[1]+'|'+q[2].join('|'));}),IDX={};
H.forEach(function(h,i){if(!(h in IDX))IDX[h]=i;});
var byTopic=TOPICS.map(function(){return [];});Q.forEach(function(q,i){byTopic[q[0]].push(i);});
var L='ABCDEFG',IV=[1,3,7,14,30,60];

/* ================= LƯU TIẾN ĐỘ (localStorage trên máy này) ================= */
var KEY='hoc-qh-v1';
function blank(){return {v:1,r:{},f:{},days:{},exams:[],cur:null,ex:null,set:{size:15,nd:10,exN:30,exM:30,exT:[]},streak:0,last:-1,seen:0};}
function fix(o){
  var b=blank();if(!o||typeof o!=='object')return b;
  ['r','f','days'].forEach(function(k){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))b[k]=o[k];});
  if(Array.isArray(o.exams))b.exams=o.exams.filter(function(x){return x&&typeof x.n==='number';});
  if(o.cur&&Array.isArray(o.cur.it))b.cur=o.cur;
  if(o.ex&&Array.isArray(o.ex.ids))b.ex=o.ex;
  if(o.set&&typeof o.set==='object')for(var k in b.set){if(o.set[k]!=null&&typeof o.set[k]===typeof b.set[k])b.set[k]=o.set[k];}
  if(typeof o.streak==='number')b.streak=o.streak;if(typeof o.last==='number')b.last=o.last;if(o.seen)b.seen=1;if(o.mig)b.mig=1;
  return b;
}
var store=blank();
try{var s0=localStorage.getItem(KEY);if(s0)store=fix(JSON.parse(s0));}catch(e){}
// Chuyển kết quả đúng/sai từ giao diện cũ (bản có trò chơi) sang, chỉ làm một lần khi máy chưa có tiến độ mới
try{if(!Object.keys(store.r).length&&!store.mig){var old=JSON.parse(localStorage.getItem('ontap-qh2025-v1')||'null');
  if(old&&old.sth){for(var oh in old.sth){var ov=old.sth[oh];if(ov===1||ov===2)store.r[oh]=learnUpd(null,ov===1,ov===1?2:0);}}
  store.mig=1;}}catch(e){}
var saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true;}catch(e){if(!saveWarned){saveWarned=true;toast('Không lưu được tiến độ – trình duyệt đang chặn hoặc hết bộ nhớ');}return false;}}
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});

/* ================= TIỆN ÍCH ================= */
var app=document.getElementById('app'),barEl=document.getElementById('bar'),sheet=document.getElementById('sheet'),sheetBox=document.getElementById('sheetBox');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function dec(x,d){return String((Math.round(x*Math.pow(10,d))/Math.pow(10,d))).replace('.',',');}
function pc(x){return x==null?'–':Math.round(x*100)+'%';}
function pad(n){return (n<10?'0':'')+n;}
function dnum(t){var d=t?new Date(t):new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function dlabel(n){var d=new Date(n*864e5);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1);}
function dt(t){var d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function dur(ms){var s=Math.max(0,Math.round(ms/1000)),m=Math.floor(s/60);return m?(m+' phút'+(s%60?' '+(s%60)+' giây':'')):(s+' giây');}
function ago(n){return n<=0?'hôm nay':n===1?'hôm qua':n+' ngày trước';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}
function same(a,b){if(!a||!b||a.length!==b.length)return false;var x=a.slice().sort(),y=b.slice().sort();return x.every(function(v,i){return v===y[i];});}
function clone(o){return o?JSON.parse(JSON.stringify(o)):null;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._);toast._=setTimeout(function(){t.classList.remove('show');},2200);}
function openSheet(h){sheetBox.innerHTML=h;sheet.classList.add('show');sheetBox.scrollTop=0;}
function closeSheet(){sheet.classList.remove('show');}
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();});
function confirmBox(msg,yes,okText,detail){
  openSheet('<h3>'+esc(msg)+'</h3>'+(detail?'<p class="mute" style="margin:0">'+detail+'</p>':'')+'<div class="row2"><button class="btn" data-act="close">Hủy</button><button class="btn pri" id="cy">'+esc(okText||'Đồng ý')+'</button></div>');
  document.getElementById('cy').onclick=function(){closeSheet();yes();};
}
var ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>'
};

/* ================= MỨC ĐỘ GHI NHỚ & LỊCH ÔN ================= */
// r = {n: số lần trả lời, c: đúng, w: sai, s: bậc ôn (0–6), due: ngày đến hạn, lr: kết quả gần nhất 1/0, h: chuỗi kết quả gần đây, rt: tự đánh giá gần nhất, ls: lần học gần nhất}
var SC={
  master:['Thành thạo','var(--ok)'],good:['Đúng nhiều lần','var(--ok2)'],unsure:['Chưa chắc','var(--warn)'],
  due:['Đến hạn ôn','var(--pri)'],wrong:['Đang sai','var(--bad)'],'new':['Chưa học','var(--grey)']
};
var SORDER=['master','good','due','unsure','wrong','new'];
function R(i){return store.r[H[i]];}
function st(i,T){var r=R(i);if(!r||!r.n)return 'new';if(r.lr===0)return 'wrong';if(r.due<=T)return 'due';if(r.s>=4)return 'master';if(r.s>=2&&!(r.rt<=1))return 'good';return 'unsure';}
function often(i){var r=R(i);return !!(r&&r.w>=2&&(r.lr===0||(r.h||'').slice(-3).indexOf('0')>=0));}
function learnUpd(pv,ok,rt){
  var T=dnum(),r=pv?clone(pv):{n:0,c:0,w:0,s:0,due:0,h:''};
  var early=r.n>0&&r.lr===1&&r.due>T; // ôn trước hạn: không tăng bậc
  r.n++;r.ls=Date.now();r.h=((r.h||'')+(ok?'1':'0')).slice(-8);r.rt=rt;
  if(!ok){r.w++;r.s=0;r.due=T+1;r.lr=0;return r;}
  r.c++;
  if(early){if(rt===0){r.s=Math.max(0,r.s-1);r.due=Math.min(r.due,T+1);}else if(rt===1)r.due=Math.min(r.due,T+1);}
  else if(rt===0){r.s=Math.max(0,r.s-1);r.due=T+1;}
  else if(rt===1){r.due=T+(r.s?Math.max(1,Math.round(IV[r.s-1]/2)):1);}
  else{r.s=Math.min(r.s+1,IV.length);r.due=T+IV[Math.min(r.s-1+(rt===3?1:0),IV.length-1)];}
  r.lr=1;return r;
}
function exUpd(h,ok){
  var T=dnum(),r=store.r[h]||{n:0,c:0,w:0,s:0,due:0,h:''};
  if(ok)r.ec=(r.ec||0)+1; // đúng khi thi: ghi nhận, KHÔNG tính là thành thạo
  else{r.ew=(r.ew||0)+1;r.n++;r.w++;r.h=((r.h||'')+'0').slice(-8);r.lr=0;r.s=0;r.due=T;r.ls=Date.now();}
  store.r[h]=r;
}
function userStats(){
  try{var O=overall(dnum()),q=0,k=0,d=0;Object.keys(store.days||{}).forEach(function(x){var v=store.days[x];if(v&&v.n){q+=v.n;k+=v.c;d++;}});
  var s={a:O.att,q:q,k:k,d:d,t:Q.length};if(USER&&USER.name)s.n=String(USER.name).slice(0,59);return s;}catch(e){return null;}
}
if(window.ONLINE&&ONLINE.user&&USER&&USER.code)ONLINE.user(USER.code,userStats);
function touchDay(){var T=dnum();if(store.last===T)return;store.streak=(store.last===T-1)?(store.streak||0)+1:1;store.last=T;}
function streak(){var T=dnum();return (store.last===T||store.last===T-1)?(store.streak||0):0;}
function dayLog(ok,isNew,ms){var k=String(dnum()),d=store.days[k]||{n:0,c:0,nw:0,t:0};d.n++;if(ok)d.c++;if(isNew)d.nw++;d.t+=Math.min(ms||0,300000);store.days[k]=d;
  var ks=Object.keys(store.days);if(ks.length>120){ks.sort(function(a,b){return a-b;}).slice(0,ks.length-120).forEach(function(x){delete store.days[x];});}}
function newToday(){var d=store.days[String(dnum())];return d?d.nw:0;}

function tinfo(ti,T){
  var o={n:0,att:0,a:0,c:0,rc:0,rn:0,master:0,good:0,unsure:0,due:0,wrong:0,'new':0,flag:0,often:0};
  byTopic[ti].forEach(function(i){o.n++;var r=R(i);o[st(i,T)]++;if(store.f[H[i]])o.flag++;if(often(i))o.often++;
    if(r&&r.n){o.att++;o.a+=r.n;o.c+=r.c;var hh=(r.h||'').slice(-3);for(var k=0;k<hh.length;k++){o.rn++;if(hh[k]==='1')o.rc++;}}});
  o.acc=o.rn?o.rc/o.rn:null;o.lv=o.rn>=5?(o.acc>=.85?3:o.acc>=.7?2:o.acc>=.5?1:0):null;
  return o;
}
var LV=[['Cần cải thiện','bad'],['Trung bình','warn'],['Khá','pri'],['Tốt','ok']];
function lvChip(o){return o.lv==null?'':'<span class="chip '+LV[o.lv][1]+'">'+LV[o.lv][0]+'</span>';}
function overall(T){
  var o={n:Q.length,att:0,a:0,c:0,master:0,good:0,unsure:0,due:0,wrong:0,'new':0,flag:0};
  Q.forEach(function(q,i){var r=R(i);o[st(i,T)]++;if(store.f[H[i]])o.flag++;if(r&&r.n){o.att++;o.a+=r.n;o.c+=r.c;}});
  o.acc=o.a?o.c/o.a:null;return o;
}
function weakTopics(T){
  var w=[];TOPICS.forEach(function(_,ti){var o=tinfo(ti,T);if(o.lv!=null&&o.acc<.7)w.push([ti,o]);});
  return w.sort(function(a,b){return a[1].acc-b[1].acc;});
}
function segBar(o){var h='<div class="seg">';SORDER.forEach(function(k){if(o[k]&&k!=='new')h+='<i style="width:'+(o[k]/o.n*100)+'%;background:'+SC[k][1]+'"></i>';});return h+'</div>';}

/* ================= GỢI Ý "HÔM NAY HỌC GÌ" ================= */
function plan(extra){
  var T=dnum(),size=store.set.size,used={},out=[],cnt={often:0,due:0,weak:0,unsure:0,'new':0};
  var all=Q.map(function(_,i){return i;});
  function add(i,w){if(out.length>=size||used[H[i]])return;used[H[i]]=1;out.push({h:H[i],w:w});cnt[w]++;}
  function ls(i){var r=R(i);return r&&r.ls||0;}
  var g1=all.filter(function(i){var r=R(i);return often(i)&&r.due<=T;}).sort(function(a,b){return R(b).w-R(a).w||ls(a)-ls(b);});
  var g2=all.filter(function(i){var r=R(i);return r&&r.n&&r.due<=T;}).sort(function(a,b){return (R(a).lr-R(b).lr)||(R(a).due-R(b).due);});
  var wk=weakTopics(T).slice(0,2).map(function(x){return x[0];}),wset={};wk.forEach(function(t){wset[t]=1;});
  var g3=all.filter(function(i){var s=st(i,T);return wset[Q[i][0]]&&(s==='unsure'||s==='good');}).sort(function(a,b){return ls(a)-ls(b);});
  var g4=all.filter(function(i){return st(i,T)==='unsure';}).sort(function(a,b){return ls(a)-ls(b);});
  var g5=all.filter(function(i){return st(i,T)==='new';});
  var newLeft=extra?size:Math.max(0,store.set.nd-newToday());
  var reserve=Math.min(newLeft,g5.length,Math.max(2,Math.round(size*.2)));
  var groups=[[g1,'often'],[g2,'due'],[g3,'weak'],[g4,'unsure']];
  if(!extra)groups.forEach(function(g){g[0].forEach(function(i){if(out.length<size-reserve)add(i,g[1]);});});
  var nn=0;g5.forEach(function(i){if(nn<newLeft&&out.length<size){var b=out.length;add(i,'new');if(out.length>b)nn++;}});
  if(!extra)groups.forEach(function(g){g[0].forEach(function(i){add(i,g[1]);});});
  return {items:out,cnt:cnt,weak:wk,newLeft:newLeft,newAll:g5.length};
}

function whyText(it,i,s0){

  switch(it.w){
    case 'again':return 'Hỏi lại câu bạn vừa trả lời sai';
    case 'exam':return 'Bạn làm sai câu này trong bài thi';
    case 'often':return 'Bạn đã trả lời sai câu này '+(r?r.w:2)+' lần';
    case 'weak':return 'Thuộc chủ đề bạn đang yếu';
    case 'new':return 'Câu mới';
  }
  var s=s0||st(i,T);
  if(s==='wrong')return 'Lần trước bạn trả lời sai';
  if(s==='due')return 'Đến hạn ôn lại · lần trước '+(r&&r.ls?ago(T-dnum(r.ls)):'');
  if(s==='unsure')return 'Lần trước bạn còn chưa chắc';
  if(s==='good')return 'Đã đúng nhiều lần';
  if(s==='master')return 'Đã thành thạo – ôn để giữ vững';
  if(it.w==='flag')return 'Câu bạn đã đánh dấu';
  return 'Câu mới';
}

  if(V.name==='q'&&S){var a=S.a[S.i];
    if(!a&&j>=0&&j<Q[IDX[S.it[S.i].h]][2].length){ACT.pick(String(j));e.preventDefault();}
    else if(e.key==='Enter'){if(a)ACT.next();else if(S.pk&&S.pk.length)ACT.check();e.preventDefault();}}
  else if(V.name==='exam'&&store.ex){if(j>=0&&j<Q[IDX[store.ex.ids[store.ex.i]]][2].length){ACT.exPick(String(j));}
    else if(e.key==='ArrowRight')ACT.exGo('1');else if(e.key==='ArrowLeft')ACT.exGo('-1');}
});

render();
}

/* ================= ĐĂNG NHẬP: dùng chung mật khẩu & mã cán bộ với app cũ ================= */
(function(){
var PK='ontap-qh2025-pw',CK='ontap-qh2025-ma',NEED=!!window.YEU_CAU_MA_CB,ENC=null;
var app=document.getElementById('app');
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function normCode(s){return String(s||'').replace(/\s+/g,'').toUpperCase();}
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function unlock(pw){
  var c=window.crypto&&window.crypto.subtle;if(!c)return Promise.reject('nocrypto');
  return c.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return c.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return c.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));},function(){throw 'pw';})
  .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));},function(){throw 'pw';});
}
function check(raw,code){
  var codes=raw.codes||{},user={code:'',name:''};
  if(NEED){
    if(!code)throw 'nocode';
    if(/^\d+$/.test(code))throw 'numcode';
    if(Object.keys(codes).length&&!Object.prototype.hasOwnProperty.call(codes,code))throw 'badcode';
    user.code=code;user.name=codes[code]||'';
  }
  return user;
}
function watermark(text){
  var w=Math.max(230,text.length*13+90),h=Math.round(w*0.62);
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'><text x='"+(w/2)+"' y='"+(h/2+6)+"' text-anchor='middle' transform='rotate(-28 "+(w/2)+" "+(h/2)+")' font-family='Arial,Helvetica,sans-serif' font-size='19' font-weight='700' fill='rgba(120,120,120,0.15)'>"+esc(text)+"</text></svg>";
  var d=document.createElement('div');d.className='wm';
  d.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  document.body.appendChild(d);
}
function start(raw,user){
  try{runApp(raw,user);}catch(e){app.innerHTML='<div class="empty" style="margin-top:20vh">Có lỗi khi mở ứng dụng.<br><small>'+esc(e&&e.message||e)+'</small><br><br><button class="btn pri" onclick="location.reload()">Tải lại</button></div>';if(window.console)console.error(e);return;}
  if(window.ONLINE)ONLINE.start();
  watermark(user.code||'TÀI LIỆU NỘI BỘ');
}
var MSG={pw:'Sai mật khẩu, vui lòng thử lại.',nocode:'Vui lòng nhập User AD cán bộ.',numcode:'User AD không được là dãy toàn số. Vui lòng nhập đúng User AD (ví dụ: NAMNT4).',badcode:'User AD này không có trong danh sách được phép sử dụng.',nocrypto:'Trình duyệt này không hỗ trợ. Hãy mở bằng Safari hoặc Chrome qua đường link https.'};
function form(msg){
  var sc=get(CK)||'';
  document.getElementById('bar').innerHTML='';
  app.innerHTML='<div class="login"><div class="lc"><img src="icon.png" alt="" width="64" height="64" style="border-radius:16px"><h1 style="font-size:21px;margin:12px 0 4px">'+esc(TEN+' '+NAM)+'</h1><p class="mute" style="margin:0 0 22px">Học thông minh – nhớ lâu, biết mình cần ôn gì<span class="rl"></span></p>'+
  '<form id="pf">'+(NEED?'<input type="text" id="ma" placeholder="User AD cán bộ" autocapitalize="characters" autocomplete="username" value="'+esc(sc)+'" style="text-align:center;margin-bottom:10px">':'')+
  '<input type="password" id="pw" placeholder="Mật khẩu (mặc định: Vietinbank)" autocomplete="current-password" style="text-align:center;margin-bottom:10px">'+
  '<label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mute);margin-bottom:14px"><input type="checkbox" id="rm" checked> Ghi nhớ trên máy này</label>'+
  '<button class="btn pri big" id="pb">Vào học</button></form><p id="pm" style="color:var(--bad);min-height:24px;margin-top:12px">'+(msg||'')+'</p>'+
  '<p class="ft" style="font-size:12.5px;margin-top:18px">Tài liệu nội bộ – không chia sẻ ra ngoài.<br>Phiên bản '+APP_VER+' · '+APP_DATE+'<br><b>'+esc(APP_AUTHOR)+'</b></p></div></div>';
  document.getElementById('pf').onsubmit=function(e){e.preventDefault();
    var pw=document.getElementById('pw').value.trim(),ma=NEED?normCode(document.getElementById('ma').value):'';
    if(NEED&&!ma){document.getElementById('pm').textContent=MSG.nocode;return;}
    if(NEED&&/^\d+$/.test(ma)){document.getElementById('pm').textContent=MSG.numcode;document.getElementById('ma').focus();return;}
    if(!pw)return;
    var bt=document.getElementById('pb');bt.disabled=true;bt.textContent='Đang mở…';
    unlock(pw).then(function(raw){
      var user=check(raw,ma);
      if(document.getElementById('rm').checked){set(PK,pw);set(CK,ma||null);}else{set(PK,null);set(CK,null);}
      start(raw,user);
    }).catch(function(err){form(MSG[err]||MSG.pw);});
  };
  setTimeout(function(){var p=document.getElementById(NEED&&!sc?'ma':'pw');if(p)p.focus();},50);
}
function boot(){
  var pw=get(PK),ma=get(CK)||'';
  if(pw){
    app.innerHTML='<div class="empty" style="margin-top:30vh">Đang mở…</div>';
    unlock(pw).then(function(raw){start(raw,check(raw,ma));}).catch(function(err){
      if(err==='pw')set(PK,null);
      if(err==='numcode')set(CK,null);
      form(err==='numcode'?MSG.numcode:err==='badcode'?MSG.badcode:(err==='nocode'?'':MSG.pw.replace('Sai mật khẩu','Mật khẩu đã được thay đổi')));
    });
  } else form();
}
app.innerHTML='<div class="empty" style="margin-top:30vh">Đang tải…</div>';
fetch(SRC+'data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){if(!j||!j.c||!j.s||!j.i)throw 0;ENC=j;boot();})
.catch(function(){app.innerHTML='<div class="empty" style="margin-top:25vh">Không tải được bộ câu hỏi.<br>Kiểm tra kết nối mạng rồi mở lại.<br><br><button class="btn pri" onclick="location.reload()">Thử lại</button></div>';});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
