<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập</title></head>
<body style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;padding:30vh 20px 0;color:#555">Đang mở…
<script>
// Link riêng: /ontap/<user AD>  ->  /ontap/?u=<user AD>
(function(){var seg=location.pathname.split('/').filter(Boolean),base='/'+(seg[0]||'')+'/',u=seg[1]||'';
if(location.hostname.indexOf('github.io')<0){base='/';u=seg[0]||'';}
if(u&&/^[A-Za-z0-9._-]{2,40}$/.test(u))location.replace(base+'?u='+encodeURIComponent(u));else location.replace(base);})();
</script></body></html>
